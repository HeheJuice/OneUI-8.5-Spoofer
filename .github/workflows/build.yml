name: Build LSPosed Module

on:
  push:
    branches: [ "main" ]
    # Tells GitHub to completely ignore edits to markdown files
    paths-ignore:
      - 'README.md'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Crucial: Allows the runner to push the APK back to your repository
    permissions:
      contents: write 

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Compile Debug APK
      run: gradle assembleDebug

    # Creates the 'debug' folder, copies the APK, and skips triggering another workflow loop
    - name: Copy APK to Debug Folder and Push
      run: |
        mkdir -p debug
        cp app/build/outputs/apk/debug/app-debug.apk debug/OneUISpoof-debug.apk
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add debug/OneUISpoof-debug.apk
        # [skip ci] prevents the runner's own automated commit from starting a new build
        git commit -m "Automated build: Update debug artifact [skip ci]" || echo "No changes to commit"
        # Force push to safely bypass remote history conflicts
        git push origin main --force 

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lsposed-module-debug
        path: debug/OneUISpoof-debug.apk
