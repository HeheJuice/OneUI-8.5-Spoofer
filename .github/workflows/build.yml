name: Build LSPosed Module

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Crucial: Allows the runner to push the APK back to your repository
    permissions:
      contents: write 

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Java Development Kit
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.5

    - name: Compile Debug APK
      run: gradle assembleDebug

    # Replaces your old upload block to create the 'debug' folder and push it back
    - name: Copy APK to Debug Folder and Push
      run: |
        mkdir -p debug
        cp app/build/outputs/apk/debug/app-debug.apk debug/OneUISpoof-debug.apk
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add debug/OneUISpoof-debug.apk
        git commit -m "Automated build: Update debug artifact" || echo "No changes to commit"
        git push origin main

    - name: Upload Finished Artifact
      uses: actions/upload-artifact@v4
      with:
        name: lsposed-module-debug
        path: debug/OneUISpoof-debug.apk
